name: CMake macOS

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

env:
  BUILD_TYPE: Release

jobs:
  gcc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install GCC 15 and CMake
        run: |
          brew install cmake gcc@15
          echo "$(brew --prefix gcc@15)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset ci-gcc

      - name: Build
        run: cmake --build --preset ci-gcc -j

      - name: Test
        run: ctest --preset ci-gcc
