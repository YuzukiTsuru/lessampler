name: CMake Windows

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

env:
  BUILD_TYPE: Release

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          cmake --version
          cl | findstr /C:"Version"

      - name: Configure
        run: cmake --preset ci-msvc

      - name: Build
        run: cmake --build --preset ci-msvc -j

      - name: Test
        run: ctest --preset ci-msvc
