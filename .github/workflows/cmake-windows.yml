name: CMake Windows

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

env:
  BUILD_TYPE: Release

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show toolchain versions
        shell: cmd
        run: |
          cmake --version
          cl 2>&1 | findstr /C:"Version"

      - name: Configure
        run: cmake --preset ci-msvc

      - name: Build
        run: cmake --build --preset ci-msvc -j

      - name: Test
        run: ctest --preset ci-msvc

  msvc-neural:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci-msvc-neural

      - name: Build
        run: cmake --build --preset ci-msvc-neural -j

      - name: Test
        run: ctest --preset ci-msvc-neural
