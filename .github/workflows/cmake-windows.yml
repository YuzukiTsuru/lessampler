name: CMake Windows

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

env:
  BUILD_TYPE: Release

jobs:
  msvc-max:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show toolchain versions
        shell: cmd
        run: |
          cmake --version
          cl 2>&1 | findstr /C:"Version"

      - name: Configure with every backend
        run: cmake --preset ci-msvc-max

      - name: Build
        run: cmake --build --preset ci-msvc-max -j

      - name: Test
        run: ctest --preset ci-msvc-max

      - name: Package
        run: cmake --build --preset ci-msvc-max --target package

      - name: Smoke test package
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/ci-msvc-max/lessampler-*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist -Force
          $exe = Get-ChildItem dist -Recurse -Filter lessampler.exe | Select-Object -First 1
          & $exe.FullName --version
          $smoke = Join-Path $env:TEMP "lessampler-wavtool-smoke.wav"
          $missing = Join-Path $env:TEMP "lessampler-missing.wav"
          Remove-Item $smoke -ErrorAction SilentlyContinue
          & $exe.FullName $smoke $missing 0 100 0 5 35 0 100 100 0 0 0 10 100
          if (-not (Test-Path $smoke)) { throw "wavtool mode did not write output" }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: lessampler-windows-x86_64
          path: build/ci-msvc-max/lessampler-*.zip*
