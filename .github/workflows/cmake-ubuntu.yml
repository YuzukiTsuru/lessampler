name: CMake Ubuntu

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"

env:
  BUILD_TYPE: Release
  CMAKE_VERSION: 3.31.12

jobs:
  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install GCC 15 and CMake
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15
          curl -L -o /tmp/cmake.tar.gz "https://cmake.org/files/v3.31/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset ci-gcc

      - name: Build
        run: cmake --build --preset ci-gcc -j

      - name: Test
        run: ctest --preset ci-gcc

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-gcc-metadata
          path: |
            build/ci-gcc/compile_commands.json
            build/ci-gcc/Testing
          if-no-files-found: ignore

  gcc-llsm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install GCC 15 and CMake
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15
          curl -L -o /tmp/cmake.tar.gz "https://cmake.org/files/v3.31/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure with LLSM
        run: cmake --preset ci-llsm

      - name: Build
        run: cmake --build --preset ci-llsm -j

      - name: Test
        run: ctest --preset ci-llsm

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Clang 21 and CMake
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-21 clang-format-21
          curl -L -o /tmp/cmake.tar.gz "https://cmake.org/files/v3.31/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset ci-clang

      - name: Build
        run: cmake --build --preset ci-clang -j

      - name: Test
        run: ctest --preset ci-clang

      - name: Check formatting
        run: |
          find src test tools -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-21 --dry-run --Werror

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install GCC 15 and CMake
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-15
          curl -L -o /tmp/cmake.tar.gz "https://cmake.org/files/v3.31/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          tar -xzf /tmp/cmake.tar.gz -C /tmp
          echo "/tmp/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure with ASan/UBSan
        run: cmake --preset asan-gcc

      - name: Build
        run: cmake --build --preset asan-gcc -j

      - name: Test
        run: ctest --preset asan-gcc
